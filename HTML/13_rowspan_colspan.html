<html>
    <head>
        <title>
            Table Rowspan and Colspan
        </title>
    </head>
    <body>
        <h1>Student Result</h1>
        <table border="1" cellpadding="10" cellspacing="5">
            <tr>
                <th colspan="3">student details</th>
            </tr>
            <tr>
                <th>Name</th>
                <th>Subjects</th>
                <th>Marks</th>
            </tr>
            <tr>
                <td rowspan="4">ABC</td>
                <td>HTML</td>
                <td>85</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Python</td>
                <td>88</td>
            </tr>
            <tr>
                <td>Java</td>
                <td>80</td>
            </tr>
        </table>
    </body>
</html>
