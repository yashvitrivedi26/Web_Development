<html>
    <head>
        <title>Forgot Password</title>
    </head>
    <body>
        <form action="success.html" method="post">
            <table border="1" align="center" width="50%" cellpadding="10">
                <tr>
                    <th>Forgot Password</th>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">Enter your registered email address to reset your password</td>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">Email Address</td>
                </tr>
                <tr>
                    <td><input type="email" name="email" id="email" required/></td>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">New Password</td>
                </tr>
                <tr>
                    <td><input type="password" name="newpassword" id="newpassword" required/></td>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">Confirm Password</td>
                </tr>
                <tr>
                    <td><input type="password" name="confirmpassword" id="confirmpassword" required/></td>
                </tr>
                <tr>
                    <td align="center">
                        <button type="submit">Reset Password</button>
                        <button type="reset">Clear All</button>
                    </td>
                </tr>
                <tr>
                    <td align="center"><a href="20_login.html">Back to Login</a></td>
                </tr>
            </table>
        </form>
    </body>
</html>
